name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Fix web folder
        run: |
          echo "===== Repository files ====="
          find . -maxdepth 2 -type f | sort

          if [ -d "wwww" ] && [ ! -d "www" ]; then
            echo "Renaming wwww -> www"
            mv wwww www
          fi

          if [ ! -f "www/index.html" ]; then
            echo "ERROR: www/index.html was not found!"
            exit 1
          fi

          echo "===== www contents ====="
          ls -la www

      - name: Create Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===== APK files ====="
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bricks-Breaker-Quest-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
