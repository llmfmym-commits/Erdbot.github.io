name: Build Bricks Breaker Quest APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check game files
        run: |
          echo "===== Repository files ====="
          find . -maxdepth 3 -type f | sort

          echo "===== Checking www ====="

          if [ -f "www/index.html" ]; then
            echo "OK: www/index.html found"
          elif [ -f "index.html" ]; then
            echo "Found index.html in root. Moving it to www/"
            mkdir -p www
            cp index.html www/index.html
          else
            echo "ERROR: index.html was not found!"
            exit 1
          fi

          echo "===== www contents ====="
          ls -lah www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bricksbreaker.quest",
            "appName": "Bricks Breaker Quest",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Game
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bricks-Breaker-Quest-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
