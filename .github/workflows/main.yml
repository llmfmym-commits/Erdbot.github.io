name: Build Bricks Breaker Quest Signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check game files
        run: |
          echo "===== Repository files ====="
          find . -maxdepth 3 -type f | sort

          echo "===== Checking www ====="

          if [ -f "www/index.html" ]; then
            echo "OK: www/index.html found"
          elif [ -f "index.html" ]; then
            echo "Found index.html in root. Moving it to www/"
            mkdir -p www
            cp index.html www/index.html
          else
            echo "ERROR: index.html was not found!"
            exit 1
          fi

          echo "===== www contents ====="
          ls -lah www

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bricksbreaker.quest",
            "appName": "Bricks Breaker Quest",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Game
        run: |
          npx cap sync android

      # ساخت کلید امضای Release
      - name: Create Release Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Bricks Breaker Quest, OU=Game, O=Bricks Breaker Quest, L=Unknown, ST=Unknown, C=US"

      # تنظیم امضای Release
      - name: Configure Android Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cp release.keystore android/app/release.keystore

          cat >> android/gradle.properties <<EOF

          BRICKS_STORE_FILE=release.keystore
          BRICKS_STORE_PASSWORD=$KEYSTORE_PASSWORD
          BRICKS_KEY_ALIAS=$KEY_ALIAS
          BRICKS_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          text = text.replace(
              "android {",
              """android {

              signingConfigs {
                  release {
                      storeFile file(project.findProperty("BRICKS_STORE_FILE"))
                      storePassword project.findProperty("BRICKS_STORE_PASSWORD")
                      keyAlias project.findProperty("BRICKS_KEY_ALIAS")
                      keyPassword project.findProperty("BRICKS_KEY_PASSWORD")
                  }
              }
          """,
              1
          )

          text = text.replace(
              "buildTypes {",
              """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              """,
              1
          )

          p.write_text(text)
          PY

      # ساخت APK امضاشده
      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # آپلود APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Bricks-Breaker-Quest-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
